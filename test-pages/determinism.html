<!doctype html>
<!--
  Export determinism test page. Everything on it changes over time or reacts to
  the cursor, but only through page time and input, never a frame counter, so
  any correct renderer must produce identical frames:
  CSS animation, a CSS transition started by a click, a rAF animation driven by
  its timestamp, timers, a hover style, a hover-delayed tooltip (setTimeout),
  and scrolling.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>Looit determinism test</title>
    <style>
      html,
      body {
        margin: 0;
        font:
          26px/1.3 Consolas,
          monospace;
        color: #0f172a;
      }
      body {
        height: 3000px;
        background: repeating-linear-gradient(#f8fafc 0 100px, #e2e8f0 100px 200px);
      }
      .hud {
        position: fixed;
        left: 24px;
        top: 20px;
      }
      .bar {
        position: fixed;
        left: 0;
        top: 620px;
        width: 80px;
        height: 40px;
        background: #ef4444;
        animation: slide 1.7s ease-in-out infinite alternate;
      }
      @keyframes slide {
        to {
          transform: translateX(1150px) rotate(180deg);
        }
      }
      .orb {
        position: fixed;
        left: 0;
        top: 540px;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background: #2563eb;
      }
      button {
        position: fixed;
        left: 540px;
        top: 260px;
        width: 200px;
        height: 80px;
        font: inherit;
        background: #cbd5e1;
        border: 3px solid #334155;
        border-radius: 12px;
        transition:
          background 0.6s,
          transform 0.6s;
      }
      button:hover {
        background: #fde68a;
      }
      button.clicked {
        background: #22c55e;
        transform: scale(1.3) rotate(8deg);
      }
      .tip {
        position: fixed;
        left: 560px;
        top: 360px;
        padding: 6px 12px;
        background: #0f172a;
        color: #fff;
        border-radius: 8px;
        visibility: hidden;
      }
      .tip.show {
        visibility: visible;
      }
    </style>
  </head>
  <body>
    <div class="hud">
      <div>timer <span id="timer">0</span></div>
      <div>scrollY <span id="scroll">0</span></div>
      <div id="clicked">not clicked</div>
    </div>
    <button id="btn">Click me</button>
    <div class="tip" id="tip">Tooltip after 400 ms hover</div>
    <div class="bar"></div>
    <div class="orb" id="orb"></div>
    <script>
      let timer = 0;
      setInterval(() => (document.getElementById('timer').textContent = ++timer), 100);
      const orb = document.getElementById('orb');
      function tick(ts) {
        // Position from the frame timestamp only (not a frame counter).
        const x = 600 + 550 * Math.sin(ts / 700);
        orb.style.transform = `translateX(${x.toFixed(2)}px)`;
        document.getElementById('scroll').textContent = Math.round(scrollY);
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
      const btn = document.getElementById('btn');
      const tip = document.getElementById('tip');
      let hoverTimer = 0;
      btn.addEventListener('mouseenter', () => {
        hoverTimer = setTimeout(() => tip.classList.add('show'), 400);
      });
      btn.addEventListener('mouseleave', () => {
        clearTimeout(hoverTimer);
        tip.classList.remove('show');
      });
      btn.addEventListener('click', () => {
        btn.classList.add('clicked');
        // Not performance.now(): Chromium adds random sub-millisecond jitter to it on purpose.
        document.getElementById('clicked').textContent = 'clicked at timer ' + timer;
      });
    </script>
  </body>
</html>
