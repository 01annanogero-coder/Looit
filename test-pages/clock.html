<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Looit clock test</title>
    <style>
      html,
      body {
        margin: 0;
        font:
          28px/1.3 Consolas,
          monospace;
        color: #0f172a;
      }
      body {
        height: 3000px;
        background: repeating-linear-gradient(#f8fafc 0 100px, #e2e8f0 100px 200px);
      }
      .hud {
        position: fixed;
        left: 24px;
        top: 20px;
      }
      .bar {
        position: fixed;
        left: 0;
        top: 640px;
        width: 80px;
        height: 60px;
        background: #ef4444;
        animation: slide 1s linear infinite;
      }
      @keyframes slide {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(1200px);
        }
      }
      button {
        position: fixed;
        left: 540px;
        top: 260px;
        width: 200px;
        height: 80px;
        font: inherit;
        background: #cbd5e1;
        border: 3px solid #334155;
        border-radius: 12px;
      }
      button:hover {
        background: #fde68a;
      }
      button.clicked {
        background: #22c55e;
      }
    </style>
  </head>
  <body>
    <div class="hud">
      <div>perf <span id="perf"></span> ms</div>
      <div>raf <span id="raf">0</span></div>
      <div>timer <span id="timer">0</span></div>
      <div>scrollY <span id="scroll">0</span></div>
      <div id="clicked">not clicked</div>
    </div>
    <button id="btn">Click me</button>
    <div class="bar"></div>
    <script>
      let rafCount = 0;
      const perf = document.getElementById('perf');
      const raf = document.getElementById('raf');
      const scroll = document.getElementById('scroll');
      function tick() {
        rafCount++;
        perf.textContent = performance.now().toFixed(1);
        raf.textContent = rafCount;
        scroll.textContent = Math.round(window.scrollY);
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
      let timer = 0;
      setInterval(() => (document.getElementById('timer').textContent = ++timer), 100);
      document.getElementById('btn').addEventListener('click', (e) => {
        e.currentTarget.classList.add('clicked');
        document.getElementById('clicked').textContent = 'clicked at ' + performance.now().toFixed(1);
      });
    </script>
  </body>
</html>
